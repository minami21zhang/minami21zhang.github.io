# 顶部导航栏（标签页）的链接与顺序
#
# 用法说明：
#   - 想调整标签页的先后顺序，直接上下移动下面的条目即可
#   - 想新增标签页，复制一条，改 title（显示的名字）和 url（页面地址）
#   - 从列表里删掉某一条，只是让它不在导航栏出现，
#     对应的页面文件仍然保留在 _pages/ 目录里，随时可以加回来
#
# 说明：这里不再放「首页」。点击左上角的站名「张景南 ︱ 简历·作品集」即可回到首页。
#
# 注意：模板自带的其他页面（Publications / Talks / Teaching / Portfolio /
#      Blog Posts / CV / Guide）都还在，只是没有放进导航栏。
#      需要的话，把下面注释里的内容取消注释就能重新显示。

main:
  - title: "个人简历"
    url: /resume/

  - title: "代表作"
    url: /featured/

  - title: "其他作品"
    url: /works/

  - title: "兴趣"
    url: /interests/

